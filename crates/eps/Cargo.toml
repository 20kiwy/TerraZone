[package]
name = "terrazon-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TerraZone Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
terrazon-geom = { workspace = true }
terrazon-color = { workspace = true }
terrazon-doc = { workspace = true }
terrazon-effects = { workspace = true }
terrazon-brush = { workspace = true }
terrazon-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
terrazon-metafile = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
terrazon-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }

[dev-dependencies]
terrazon-testkit = { workspace = true }
